name: Deploy Field Guide to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/field-guide/**"
      - "docs/field-guide-flat.html"
      - "pages-hub/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site

          # 1. Landing hub at the root + shared assets (logo, favicon)
          cp pages-hub/owners.html _site/index.html
          cp pages-hub/announce.html _site/announce.html
          cp pages-hub/owners.html _site/owners.html
          cp pages-hub/product.html _site/product.html
          cp pages-hub/interested.html _site/interested.html
          cp pages-hub/share.html _site/share.html
          cp pages-hub/plan.html _site/plan.html
          cp pages-hub/index.html _site/hub.html
          cp pages-hub/desktop-dashboard.html _site/
          cp pages-hub/dashboard.html _site/
          cp -r pages-hub/assets _site/
          # Inject live platform stats from the field guide data into the hub
          # (stdlib Python — no node/npm anywhere in the build)
          python3 - <<'PYEOF'
          import json, re

          text = open("docs/field-guide/data.js", encoding="utf-8").read().strip()
          for prefix in ("window.FIELD_GUIDE_DATA = ", "const FIELD_GUIDE_DATA = "):
              if text.startswith(prefix):
                  text = text[len(prefix):]
                  break
          data = json.loads(text.strip().rstrip(";\n"))
          stats = data.get("stats", {})

          html = open("_site/hub.html", encoding="utf-8").read()
          for key, stat in (
              ("s-tools", "tools"),
              ("s-agents", "agents"),
              ("s-plugins", "plugins"),
              ("s-commits", "commitsLast2Months"),
          ):
              html = html.replace(
                  f'id="{key}">—<', f'id="{key}">{stats.get(stat, "—")}<'
              )
          open("_site/hub.html", "w", encoding="utf-8").write(html)
          PYEOF

          # 2. Interactive field guide explorer
          mkdir -p _site/field-guide
          cp -r docs/field-guide/. _site/field-guide/

          # 3. Release observatory
          mkdir -p _site/releases
          cp pages-hub/updates.html _site/releases/index.html

          # 3b. Architecture diagram
          mkdir -p _site/architecture
          cp pages-hub/architecture.html _site/architecture/index.html

          # 3c. Design system reference page
          mkdir -p _site/design
          cp pages-hub/design.html _site/design/index.html

          # 3d. Mechanics (self-healing loop, gates & judges)
          mkdir -p _site/mechanics
          cp pages-hub/mechanics.html _site/mechanics/index.html

          # 3e. Council & the Approval Wall (governance story)
          mkdir -p _site/council
          cp pages-hub/council.html _site/council/index.html

          # 4. Fully-offline flat file
          mkdir -p _site/flat
          cp docs/field-guide-flat.html _site/flat/index.html

          # 5. Product announcement landing (site root, beside the hub —
          #    its ./assets/ refs then resolve identically locally + deployed)
          # 5b. Roadmap boards at site root (same ./assets/ resolution)
          cp pages-hub/phases.html _site/phases.html
          cp pages-hub/progress.html _site/progress.html

          # 5c. Custom domain (sprucegrove.io, purchased 2026-09-11 at
          #     Porkbun). Matches the Pages settings cname so Actions builds
          #     always carry the domain, even after settings drift.
          echo "sprucegrove.io" > _site/CNAME

          # Stop GitHub Pages from Jekyll-transforming anything
          touch _site/.nojekyll

      # NOTE: actions/configure-pages deliberately omitted. It only sets
      # static-generator metadata we don't use, and its codeload tarball
      # was persistently 429ing (3 failed deploys on 2026-08-17).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4