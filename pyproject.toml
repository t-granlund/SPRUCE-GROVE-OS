[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spruce-grove"
version = "1.0.15"
description = "Spruce Grove OS - an agentic coding CLI distribution inspired by Code Puppy. Together we are better. Always."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "code-puppy-core-plugins>=0.0.45",
    "logfire>=4.0",
    "pydantic-ai-slim[openai,anthropic,mcp]==2.35.0",
    "pydantic-ai-harness==0.23.0",
    "anyio>=4.7.0",
    "typer>=0.12.0",
    "mcp>=1.9.4",
    "httpx[http2]>=0.24.1",
    "httpx2>=2.7",
    "requests>=2.28.0",
    "packaging>=24.0",
    "rich>=13.4.2",
    "pydantic>=2.4.0",
    "python-dotenv>=1.0.0",
    "json-repair>=0.46.2",
    "pyfiglet>=0.8.post1",
    "rapidfuzz>=3.13.0",
    "openai>=2.45.0",
    "ripgrep==14.1.0; sys_platform != 'android'",
    "playwright>=1.40.0; sys_platform != 'android'",
    "termflow-md>=0.9.1",
    "Pillow>=10.0.0",
    "azure-identity>=1.15.0",
    "anthropic>=1.0.0,<2",
    "boto3>=1.43.9",
    "keyring>=24.0.0",
    "agent-client-protocol>=0.11.0,<0.12",
]
dev-dependencies = [
    "pytest>=8.3.4",
    "pytest-cov>=6.1.1",
    "pytest-asyncio>=0.23.1",
    "ruff>=0.15,<0.16",
    "pexpect>=4.9.0",
]
authors = [
    {name = "Tyler Granlund", email = "hello@tylergranlund.com"},
    {name = "Michael Pfaffenberger"}  # original author of Code Puppy, the project this is inspired by and built from
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.35.0"]
durable = ["dbos>=2.11.0"]
computer-use = [
    "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
]

[project.urls]
repository = "https://github.com/t-granlund/SPRUCE-GROVE-OS"
HomePage = "https://tylergranlund.com"


[project.scripts]
spruce-grove = "spruce_grove.main:main_entry"
grove = "spruce_grove.main:main_entry"

[tool.logfire]
ignore_no_config = true

[tool.hatch.build]
packages = ["spruce_grove"]

[tool.hatch.build.targets.wheel.shared-data]
"spruce_grove/models.json" = "spruce_grove/models.json"
"spruce_grove/models_dev_api.json" = "spruce_grove/models_dev_api.json"

[[tool.hatch.build.targets.sdist.include]]
path = "spruce_grove/models.json"

[[tool.hatch.build.targets.sdist.include]]
path = "spruce_grove/models_dev_api.json"

[tool.ruff.lint.per-file-ignores]
"spruce_grove/__init__.py" = ["E402"]
"spruce_grove/main.py" = ["E402"]
"spruce_grove/cli_runner.py" = ["E402"]
"spruce_grove/messaging/__init__.py" = ["E402"]

[tool.pytest.ini_options]
addopts = "--cov=spruce_grove --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["spruce_grove/main.py"]

[tool.uv]
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.1.1",
    "pytest-asyncio>=0.23.1",
    "ruff>=0.15,<0.16",
    "pexpect>=4.9.0",
    "pyte>=0.8.2",
]
