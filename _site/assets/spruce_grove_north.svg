<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Spruce Grove — the North Star grove">
  <defs>
    <linearGradient id="sg-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d689"/><stop offset=".55" stop-color="#d9a441"/><stop offset="1" stop-color="#b57f22"/>
    </linearGradient>
    <linearGradient id="sg-hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#41805a"/><stop offset=".6" stop-color="#255339"/><stop offset="1" stop-color="#12291a"/>
    </linearGradient>
    <linearGradient id="sg-kin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6043"/><stop offset="1" stop-color="#0f2015"/>
    </linearGradient>
    <radialGradient id="sg-halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d9a441" stop-opacity=".35"/><stop offset="1" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- the completeness ring: the grove is held, whole -->
  <circle cx="120" cy="130" r="104" fill="none" stroke="#98b79e" stroke-opacity=".5" stroke-width="2.5"/>
  <circle cx="120" cy="130" r="104" fill="none" stroke="#d9a441" stroke-opacity=".22" stroke-width="6"/>

  <!-- kin trees: the grove does not exist without each one -->
  <g fill="url(#sg-kin)">
    <g opacity=".92" transform="translate(56,0)">
      <path d="M0 96 L20 132 L-20 132 Z"/><path d="M0 114 L24 156 L-24 156 Z"/><path d="M0 134 L27 180 L-27 180 Z"/>
      <rect x="-3.5" y="180" width="7" height="12" rx="2"/>
    </g>
    <g opacity=".88" transform="translate(184,6) scale(.94)">
      <path d="M0 96 L20 132 L-20 132 Z"/><path d="M0 114 L24 156 L-24 156 Z"/><path d="M0 134 L27 180 L-27 180 Z"/>
      <rect x="-3.5" y="180" width="7" height="12" rx="2"/>
    </g>
    <g opacity=".7" transform="translate(196,34) scale(.62)">
      <path d="M0 96 L20 132 L-20 132 Z"/><path d="M0 114 L24 156 L-24 156 Z"/><path d="M0 134 L27 180 L-27 180 Z"/>
      <rect x="-3.5" y="180" width="7" height="12" rx="2"/>
    </g>
    <g opacity=".7" transform="translate(40,40) scale(.58)">
      <path d="M0 96 L20 132 L-20 132 Z"/><path d="M0 114 L24 156 L-24 156 Z"/><path d="M0 134 L27 180 L-27 180 Z"/>
      <rect x="-3.5" y="180" width="7" height="12" rx="2"/>
    </g>
  </g>

  <!-- the hero spruce: pure, honest, true -->
  <g fill="url(#sg-hero)">
    <path d="M120 84 L144 122 L96 122 Z"/>
    <path d="M120 104 L152 148 L88 148 Z"/>
    <path d="M120 126 L160 178 L80 178 Z"/>
    <rect x="116" y="178" width="8" height="15" rx="2.5"/>
  </g>

  <!-- the North Star: the grove in gold, modern and sleek -->
  <circle cx="120" cy="46" r="34" fill="url(#sg-halo)"/>
  <path d="M120 18 Q123.5 38 134 46 Q123.5 54 120 74 Q116.5 54 106 46 Q116.5 38 120 18 Z" fill="url(#sg-gold)"/>
  <circle cx="120" cy="46" r="3.4" fill="#f7e2a6"/>
  <path d="M172 30 Q173.2 37 177 39.5 Q173.2 42 172 49 Q170.8 42 167 39.5 Q170.8 37 172 30 Z" fill="#e8c56a" opacity=".8"/>
  <path d="M66 60 Q66.9 65 69.5 66.8 Q66.9 68.6 66 73.5 Q65.1 68.6 62.5 66.8 Q65.1 65 66 60 Z" fill="#e8c56a" opacity=".55"/>

  <!-- ground: the shared soil -->
  <path d="M52 196 Q120 204 188 196" stroke="#588f5e" stroke-opacity=".55" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
